<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ academia.nome }}{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; color: #222; background: #f6f7f9; }
    header { background: #1f6f5c; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .5rem; }
    header h1 { margin: 0; font-size: 1.3rem; }
    nav a { color: #fff; margin-left: 1.2rem; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    .card h3 { margin: 0 0 .3rem; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
    th, td { padding: .7rem 1rem; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #e6f1ee; }
  </style>
</head>
<body>
  <header>
    <h1>{{ academia.nome }}</h1>
    <nav>
      <a href="{% url 'home' %}">Início</a>
      <a href="{% url 'grade' %}">Grade de turmas</a>
    </nav>
  </header>
  <main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
